name: Build Firmware Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Create CI secrets file
        env:
          SNAP_WIFI_SSID: ${{ secrets.SNAP_WIFI_SSID }}
          SNAP_WIFI_PASSWORD: ${{ secrets.SNAP_WIFI_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          ssid = os.environ.get("SNAP_WIFI_SSID", "")
          password = os.environ.get("SNAP_WIFI_PASSWORD", "")
          if not ssid or not password:
              raise SystemExit(
                  "SNAP_WIFI_SSID and SNAP_WIFI_PASSWORD repository secrets are required for release firmware builds."
              )

          def c_string(value):
              return value.replace("\\", "\\\\").replace('"', '\\"')

          Path("include/secrets.h").write_text(
              "#pragma once\n\n"
              f'#define SNAP_WIFI_SSID_SECRET "{c_string(ssid)}"\n'
              f'#define SNAP_WIFI_PASSWORD_SECRET "{c_string(password)}"\n',
              encoding="utf-8",
          )
          PY

      - name: Check tag matches firmware version
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Firmware version mismatch."
            echo "VERSION file: $VERSION"
            echo "Git tag:      $GITHUB_REF_NAME"
            echo "Expected tag: v$VERSION"
            exit 1
          fi

      - name: Build firmware
        run: pio run

      - name: Prepare release files
        run: |
          VERSION="$(cat VERSION)"
          mkdir release
          cp .pio/build/*/firmware.bin "release/ESP32AudioClient-v${VERSION}-firmware.bin"
          cp .pio/build/*/bootloader.bin "release/ESP32AudioClient-v${VERSION}-bootloader.bin" || true
          cp .pio/build/*/partitions.bin "release/ESP32AudioClient-v${VERSION}-partitions.bin" || true
          cp RELEASE-NOTES.md "release/ESP32AudioClient-v${VERSION}-release-notes.md" || true

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE-NOTES.md
          files: release/*
