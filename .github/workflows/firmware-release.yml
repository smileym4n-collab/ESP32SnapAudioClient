name: Build Firmware Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Create CI secrets file
        run: cp include/secrets.example.h include/secrets.h

      - name: Check tag matches firmware version
        run: |
          VERSION="$(cat VERSION)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG_VERSION"

      - name: Build firmware
        run: pio run

      - name: Prepare release files
        run: |
          VERSION="$(cat VERSION)"
          mkdir release
          cp .pio/build/*/firmware.bin "release/ESP32AudioClient-v${VERSION}-firmware.bin"
          cp .pio/build/*/bootloader.bin "release/ESP32AudioClient-v${VERSION}-bootloader.bin" || true
          cp .pio/build/*/partitions.bin "release/ESP32AudioClient-v${VERSION}-partitions.bin" || true
          cp RELEASE-NOTES.md "release/ESP32AudioClient-v${VERSION}-release-notes.md" || true

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE-NOTES.md
          files: release/*
