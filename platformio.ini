[platformio]
default_envs = esp32-wrover-ie-n16r8
boards_dir = boards

[env:esp32-wrover-ie-n16r8]
platform = espressif32
board = esp32-wrover-ie-n16r8
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
  https://github.com/pschatzmann/arduino-audio-tools.git#fd511aa
  https://github.com/pschatzmann/arduino-snapclient.git#1a337cd
  https://github.com/pschatzmann/arduino-libopus.git#bae0f85
  https://github.com/pschatzmann/ESP32-A2DP.git#812ed5e

lib_ldf_mode = deep+
extra_scripts =
  pre:scripts/app_version.py
  pre:scripts/patch_snapclient_version.py

build_type = release
board_build.partitions = default_16MB.csv

build_flags =
  -O2
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_SNAPCLIENT_USE_MDNS=false
  -DCONFIG_NVS_FLASH=false
  -DRTOS_MAX_QUEUE_ENTRY_COUNT=1024
  -DRTOS_TASK_PRIORITY=4
